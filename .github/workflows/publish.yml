name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev,fasthtml,flask,django]' twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from py_flowtoken import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - run: pytest -q
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-flowtoken
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
