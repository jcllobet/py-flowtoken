name: Test Python port and upstream parity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install '.[dev,fasthtml,flask,django]'
      - run: pytest -q
      - run: python -m build --no-isolation
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "from py_flowtoken import AnimatedMarkdown, asset_path; assert 'data-ft-copy' in AnimatedMarkdown('    hello').render(); assert asset_path('flowtoken.js').is_file()"
        working-directory: /tmp
  browser:
    runs-on: ubuntu-latest
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev,fasthtml,flask,django]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: git diff --exit-code -- src/py_flowtoken/static/py_flowtoken/flowtoken.js
